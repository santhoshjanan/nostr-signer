name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # This app is Windows-only (electron-builder is configured with win-only
    # targets). "windows-latest" only resolves if a self-hosted Gitea Actions
    # runner in this instance is registered with that label -- check
    # act_runner's config.yaml (runner.labels) and adjust this value to match
    # whatever label your Windows runner actually advertises.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ gitea.sha }}
          path: out/
          retention-days: 7
