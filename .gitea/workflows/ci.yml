name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # electron-builder now packages win/mac/linux dir targets. "-latest"
    # labels only resolve if self-hosted Gitea Actions runners in this
    # instance are registered under those labels for each OS -- check
    # act_runner's config.yaml (runner.labels) and adjust matrix.os to
    # whatever labels your runners actually advertise. If only a Windows
    # runner exists, trim the matrix back to that single entry.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.os }}-${{ gitea.sha }}
          path: out/
          retention-days: 7
