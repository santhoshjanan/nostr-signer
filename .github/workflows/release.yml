name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build distributable
        run: npm run dist

      - name: Zip distributable
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath nostr-signer-${{ github.ref_name }}-win.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nostr-signer-${{ github.ref_name }}-win
          path: nostr-signer-${{ github.ref_name }}-win.zip
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nostr-signer-${{ github.ref_name }}-win.zip
          generate_release_notes: true
