name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_dir: dist/win-unpacked
            asset_name: nostr-signer-${{ github.ref_name }}-win.zip
          - os: macos-latest
            asset_name: nostr-signer-${{ github.ref_name }}-mac.zip
          - os: ubuntu-latest
            dist_dir: dist/linux-unpacked
            asset_name: nostr-signer-${{ github.ref_name }}-linux.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build distributable
        run: npm run dist

      - name: Test
        run: npm test

      - name: Zip distributable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.dist_dir }}/*" -DestinationPath "${{ matrix.asset_name }}"

      - name: Zip distributable (Linux)
        if: runner.os == 'Linux'
        run: (cd "${{ matrix.dist_dir }}" && zip -r -y "../../${{ matrix.asset_name }}" .)

      - name: Zip distributable (macOS)
        if: runner.os == 'macOS'
        # electron-builder names the dir-target output folder after the
        # build arch (mac / mac-arm64 / mac-universal), which varies with
        # the runner's host arch, so resolve it instead of hardcoding it.
        run: |
          mac_dir=$(find dist -maxdepth 1 -type d -name 'mac*' | head -n 1)
          if [ -z "$mac_dir" ]; then
            echo "No dist/mac* directory found" >&2
            exit 1
          fi
          (cd "$mac_dir" && zip -r -y "../../${{ matrix.asset_name }}" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
